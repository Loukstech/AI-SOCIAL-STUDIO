name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # La version de pnpm est lue dans le champ `packageManager` du package.json racine.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      # Aucune base ni Redis requis : les tests de Phase 0 n'en dépendent pas.
      - name: Lint, typecheck, tests et build
        run: pnpm turbo run lint typecheck test build
