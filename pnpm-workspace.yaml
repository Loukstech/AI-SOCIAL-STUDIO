packages:
  - apps/*
  - packages/*

# pnpm bloque par défaut les scripts d'installation : seuls ceux-ci sont autorisés.
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  '@ffmpeg-installer/ffmpeg': true
  prisma: true
  unrs-resolver: true
  # Refusés explicitement : télémétrie et binaire natif facultatif. Sans décision,
  # pnpm fait échouer l'installation en CI.
  '@parcel/watcher': false
  '@scarf/scarf': false
